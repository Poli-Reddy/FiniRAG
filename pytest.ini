[pytest]
# Run from the project root so `backend.app...` imports resolve.
testpaths = backend/tests
pythonpath = .

# pytest-asyncio: pin the fixture loop scope explicitly rather than
# inheriting a default that is scheduled to change.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    integration: hits the network (Gemini / Vision) or a live database; deselected by default

addopts = -ra --strict-markers -m "not integration"

filterwarnings =
    error::pydantic.PydanticDeprecatedSince20
